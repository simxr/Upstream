  - id: platform-tooling
    label: Platform tooling
    description: Developer platforms, portals, cluster lifecycle, packaging, and platform APIs.
  - id: aws-ecosystem
    label: AWS ecosystem
    description: AWS services, EKS integrations, IAM, load balancing, networking, and AWS-native operations.
