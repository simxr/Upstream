    label: Infrastructure as code
    description: Terraform, OpenTofu, providers, modules, and declarative cloud provisioning.
  - id: gitops-delivery
    label: GitOps and delivery
    description: Declarative deployment, continuous delivery, release automation, and configuration promotion.
